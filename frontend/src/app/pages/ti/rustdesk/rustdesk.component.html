<div class="pagina">
  <app-public-chrome>
    <div class="rd-page">
      <header class="page-head">
        <div>
          <h1>Rust Desk</h1>
          <p>Servidor de acesso remoto e cadastro de dispositivos da Intranet.</p>
        </div>
        <button
          type="button"
          class="btn-instalador"
          [disabled]="baixandoInstalador()"
          (click)="baixarInstalador()"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4v11M7.5 11.5L12 16l4.5-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          {{ baixandoInstalador() ? 'Baixando…' : 'Baixar instalador' }}
        </button>
      </header>

      <nav class="rd-tabs" aria-label="Rust Desk">
        <button
          type="button"
          class="rd-tab"
          [class.active]="aba() === 'biblioteca'"
          (click)="selecionarAba('biblioteca')"
        >
          Máquinas
        </button>
        <button
          type="button"
          class="rd-tab"
          [class.active]="aba() === 'servidor'"
          (click)="selecionarAba('servidor')"
        >
          Servidor
        </button>
      </nav>

      @if (aba() === 'servidor') {
        <app-rustdesk-servidor />
      } @else {
        <app-rustdesk-biblioteca />
      }
    </div>
  </app-public-chrome>
  <app-footer />
</div>
